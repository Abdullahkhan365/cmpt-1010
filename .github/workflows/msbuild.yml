# separate terms of service, privacy policy, and support
# documentation.

name: C++ Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build C++ source files
      run: |
        set -euo pipefail
        mkdir -p build
        while IFS= read -r -d '' file; do
          echo "Compiling $file"
          output="build/$(echo "$file" | tr '/ ' '__').o"
          g++ -std=c++17 -c "$file" -o "$output"
        done < <(find . -type f \( -name '*.cpp' -o -name '*.CPP' \) -print0)
